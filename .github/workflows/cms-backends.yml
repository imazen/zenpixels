name: CMS backend qualification

on:
  workflow_dispatch:
  push:
    branches: [main, "review/**"]
    paths:
      - .github/workflows/cms-backends.yml
      - Cargo.toml
      - Cargo.lock
      - zenpixels-convert/Cargo.toml
      - zenpixels-convert/tests/cms_lcms.rs
      - zenpixels-convert/tests/audit_05_regressions.rs
      - zenpixels-convert/src/cms.rs
      - zenpixels-convert/src/icc_profiles.rs
      - zenpixels-convert/src/profiles/cicp_bundle.lz4

concurrency:
  group: cms-backends-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  native:
    name: CMS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: LCMS and MoxCMS integration tests
        run: cargo test -p zenpixels-convert --features cms-lcms,cms-moxcms,icc-db --test cms_lcms --test audit_05_regressions -- --nocapture
      - name: Strict converter Clippy (CMS backends)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p zenpixels-convert --features cms-lcms,cms-moxcms,icc-db --all-targets -- -D warnings

  i686:
    name: CMS (i686)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: cms-cross-i686
      - name: LCMS and MoxCMS integration tests (i686/QEMU)
        run: cross test -p zenpixels-convert --features cms-lcms,cms-moxcms,icc-db --test cms_lcms --test audit_05_regressions --target i686-unknown-linux-gnu -- --nocapture
