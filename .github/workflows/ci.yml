name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  # ==========================================================================
  # Native testing (5-platform matrix — no macOS Intel)
  # ==========================================================================
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux x64 }
          - { os: ubuntu-24.04-arm, name: Linux aarch64 }
          - { os: macos-latest, name: macOS arm64 }
          - { os: windows-latest, name: Windows x64 }
          - { os: windows-11-arm, name: Windows arm64 }
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test workspace (default features)
        run: cargo test --workspace --lib --tests

      - name: Test workspace (all features)
        run: cargo test --workspace --all-features --lib --tests

      - name: Test doc examples
        run: cargo test --workspace --all-features --doc

      - name: Test no-default-features (zenpixels-convert)
        run: cargo test -p zenpixels-convert --no-default-features --lib --tests

      - name: Test AVX-512 tier (x64 only)
        if: runner.arch == 'X64'
        run: cargo test -p zenpixels-convert --features avx512 --lib --tests

      - name: Check no_std (zenpixels)
        run: cargo check -p zenpixels --no-default-features

      - name: Check no_std (zenpixels-convert)
        run: cargo check -p zenpixels-convert --no-default-features

      - name: Check no_std + bt2446a + perceptual (zenpixels-convert)
        run: cargo check -p zenpixels-convert --no-default-features --features bt2446a,perceptual

  # ==========================================================================
  # Cross-compiled 32-bit testing (i686 via QEMU)
  # ==========================================================================
  test-i686:
    name: Test i686
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-i686

      - name: Test workspace (i686/QEMU)
        run: cross test --workspace --lib --tests --target i686-unknown-linux-gnu

      - name: Test CMS backends (i686/QEMU)
        run: cross test -p zenpixels-convert --features cms-lcms,cms-moxcms,icc-db --test cms_lcms --target i686-unknown-linux-gnu

  # ==========================================================================
  # WASM check & WASI test
  # ==========================================================================
  wasm:
    name: WASM (wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check WASM (no_std)
        run: cargo check --workspace --target wasm32-wasip1 --no-default-features

      - name: Check WASM (no_std + bt2446a + icc-db)
        run: cargo check -p zenpixels-convert --target wasm32-wasip1 --no-default-features --features bt2446a,icc-db

      - uses: taiki-e/install-action@wasmtime
      - name: Test zenpixels core on WASI
        run: cargo test -p zenpixels --lib --tests --target wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime

  # ==========================================================================
  # Clippy & Rustdoc
  # ==========================================================================
  clippy:
    name: Clippy & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Clippy (no-default-features)
        run: cargo clippy --workspace --no-default-features -- -D warnings

      - name: Check docs (broken intra-doc links fail the build)
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # ==========================================================================
  # Format check
  # ==========================================================================
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt -p zenpixels -p zenpixels-convert -- --check

  # ==========================================================================
  # MSRV check
  # ==========================================================================
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MSRV toolchains
        run: |
          rustup toolchain install 1.85.0 --no-self-update --profile minimal
          rustup toolchain install 1.88.0 --no-self-update --profile minimal
          rustup toolchain install 1.89.0 --no-self-update --profile minimal

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV (zenpixels @ 1.85)
        run: cargo +1.85.0 check -p zenpixels

      - name: Check MSRV (zenpixels image @ 1.88)
        run: cargo +1.88.0 check -p zenpixels --features image

      - name: Check MSRV (zenpixels-convert @ 1.89)
        run: cargo +1.89.0 check -p zenpixels-convert

  # ==========================================================================
  # Feature powerset
  # ==========================================================================
  features:
    name: Feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check all feature combinations
        run: cargo hack check --workspace --feature-powerset --depth 3 --group-features imgref,rgb --exclude-features default
