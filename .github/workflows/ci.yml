name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  # ==========================================================================
  # Native testing (6-platform matrix)
  # ==========================================================================
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux x64 }
          - { os: ubuntu-24.04-arm, name: Linux aarch64 }
          - { os: macos-latest, name: macOS arm64 }
          - { os: macos-26-intel, name: macOS x64 }
          - { os: windows-latest, name: Windows x64 }
          - { os: windows-11-arm, name: Windows arm64 }
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test (workspace)
        run: cargo test --workspace

      # `cargo test --workspace` builds example targets but does not run the
      # `#[test]`s inside them (that needs `--examples`). The `common_usage` /
      # `convert_pipeline` galleries assert the documented behavior, so run them.
      - name: Test (usage examples)
        run: cargo test --workspace --examples

      # Default `cargo test` exercises only the portable scalar transpose tiers.
      # Run the orient suite again with the SIMD kernels enabled so the per-width
      # AVX2 (x64) / NEON (arm64 runners) register transposes are executed and
      # checked against the scalar `forward_map` oracle on their native arch.
      - name: Test (zenpixels-convert SIMD transpose kernels, fast-transpose)
        run: cargo test -p zenpixels-convert --features fast-transpose

      - name: Test (zenpixels-convert plan validation, with __trace_ops)
        run: cargo test -p zenpixels-convert --features __trace_ops --test plan_validation

      # The CllMeasure surface (and its test targets, including the
      # deprecated-measure parity gate) is behind the hdr-experimental
      # feature — run it explicitly so those suites execute in CI.
      - name: Test (zenpixels-convert HDR measurement, hdr-experimental)
        run: cargo test -p zenpixels-convert --features hdr-experimental

      # The estimate surface (estimate module + ConvertPlan::estimate(_in)) and
      # its whole test suite (tests/resource_estimate.rs is `#![cfg]`-gated on
      # the feature) only exist behind estimation-experimental. Without this
      # step the feature-powerset job would `check` it but never RUN a single
      # assertion — the opt-in-feature-untested-in-CI trap.
      - name: Test (zenpixels-convert resource estimation, estimation-experimental)
        run: cargo test -p zenpixels-convert --features estimation-experimental --examples --tests

      # The `avx512` feature routes the f16 slice path and the AVX-512 SIMD
      # tiers through magetypes/archmage's w512 kernels. Dispatch is at
      # runtime, so this compiles and runs on any x86-64 host (it just takes
      # the narrower tier when the runner lacks AVX-512) — but the feature was
      # otherwise never built or run in CI. x64-only: the feature gates
      # x86-specific kernels. (Opt-in SIMD features that only ever get a
      # feature-powerset `check` compile but never execute — this runs them.)
      - name: Test (zenpixels-convert avx512 tier, x64 only)
        if: runner.arch == 'X64'
        run: cargo test -p zenpixels-convert --features avx512

      - name: Check no_std (zenpixels)
        run: cargo check -p zenpixels --no-default-features

      - name: Check no_std (zenpixels-convert)
        run: cargo check -p zenpixels-convert --no-default-features

      # hdr-experimental adds transcendental math (Bt2446A / SoftCompress /
      # gamut compression). It must stay no_std-clean (libm, not the std f32
      # inherents) — this combination was previously never built in CI, so a
      # std-only method could regress the no_std path unnoticed.
      - name: Check no_std + hdr-experimental (zenpixels-convert)
        run: cargo check -p zenpixels-convert --no-default-features --features hdr-experimental

  # ==========================================================================
  # Cross-compiled 32-bit testing (i686 via QEMU)
  # ==========================================================================
  test-i686:
    name: Test i686
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-i686

      - name: Test (i686/QEMU)
        run: cross test --workspace --target i686-unknown-linux-gnu

      # i686 is neither x86_64 nor aarch64, so fast-transpose here exercises the
      # `incant!` 4-byte magetypes path + the scalar tiled gather — the SIMD
      # dispatch's non-native fallback branch, distinct from the x64/arm64 runs.
      - name: Test (zenpixels-convert SIMD fallback i686, fast-transpose)
        run: cross test -p zenpixels-convert --features fast-transpose --target i686-unknown-linux-gnu

  # ==========================================================================
  # WASM check
  # ==========================================================================
  wasm:
    name: WASM (wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check WASM (no_std)
        run: cargo check --workspace --target wasm32-wasip1 --no-default-features

  # ==========================================================================
  # Clippy
  # ==========================================================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Broken intra-doc links (e.g. `[\`Foo\`]` referring to a renamed/removed
      # item) are only caught by actually running rustdoc; plain `cargo check`
      # never sees them. RUSTDOCFLAGS=-D warnings turns those warnings into a
      # failing step (zenpixels#bug-19: this gate was previously absent).
      - name: Check docs (broken intra-doc links fail the build)
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # ==========================================================================
  # Public-API surface snapshots (docs/public-api/) — the CI-free `apidoc/`
  # runner package (see its Cargo.toml), so this is the only job that ever
  # compiles zenutils-apidoc's dependency tree or invokes rustdoc. Standalone
  # (not folded into the `clippy` job above) because it needs a nightly
  # toolchain for rustdoc JSON, distinct from every other job's stable
  # toolchain (zenpixels#bug-19: this gate was previously absent, so 6 new
  # public types + a broken doc link slipped in without the committed
  # snapshots ever being checked against them).
  #
  # apidoc/Cargo.toml currently path-depends on the sibling imazen/zenutils
  # checkout (zenutils-apidoc 0.1.2's `no_file_meta_header`/
  # `no_autotraits_summary` builders aren't on crates.io yet — see the
  # comment in apidoc/Cargo.toml), so this job checks that sibling out next
  # to zenpixels before running the snapshot test, mirroring the
  # `checkout-siblings` pattern used by zenwebp/zenpipe for their own
  # path-dependent siblings.
  api-doc:
    name: Public API snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned to a specific commit, NOT `ref: main` — an unrelated push to
      # imazen/zenutils would otherwise be able to break this repo's CI. Bump
      # this SHA deliberately when adopting a newer zenutils-apidoc (and regen
      # the docs/public-api snapshots in the same commit). Eliminated entirely
      # once zenutils-apidoc 0.1.2's builders reach crates.io (then apidoc/
      # can depend on the published crate and this checkout goes away).
      - name: Checkout sibling imazen/zenutils
        uses: actions/checkout@v6
        with:
          repository: imazen/zenutils
          ref: 1921bc23d2834c203e017d89197decf4fd3330d3 # zenutils main @ 2026-07-14
          path: __siblings/zenutils

      - name: Move sibling to parent of GITHUB_WORKSPACE
        run: |
          mv __siblings/zenutils ../zenutils
          rmdir __siblings || true

      - uses: dtolnay/rust-toolchain@nightly # rustdoc JSON for public-api
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check committed API snapshots are current
        run: cargo test --manifest-path apidoc/Cargo.toml
        env:
          ZEN_API_DOC: check

  # ==========================================================================
  # Format check
  # ==========================================================================
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

  # ==========================================================================
  # MSRV check
  # ==========================================================================
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install MSRV toolchains
        run: |
          rustup toolchain install 1.85.0 --no-self-update --profile minimal
          rustup toolchain install 1.89.0 --no-self-update --profile minimal

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV (zenpixels @ 1.85)
        run: cargo +1.85.0 check -p zenpixels

      - name: Check MSRV (zenpixels-convert @ 1.89)
        run: cargo +1.89.0 check -p zenpixels-convert

  # ==========================================================================
  # Feature powerset (all feature combinations compile)
  # ==========================================================================
  features:
    name: Feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check all feature combinations
        run: cargo hack check --workspace --exclude icc-gen --feature-powerset --depth 3 --group-features imgref,rgb --exclude-features default,__bench_u16_hybrids,__trace_ops

  # ==========================================================================
  # Code coverage
  # ==========================================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
