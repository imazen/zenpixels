[package]
name = "zenpsychovisual-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/imazen/zenpixels"
description = "Still-image quality contracts, native maps and metric identity"
publish = false

[workspace]

[features]
default = []
std = ["zenpixels/std"]

[dependencies]
zenpixels = { path = "../zenpixels", version = "0.3.1", default-features = false }
how-far = { version = "0.1.0", default-features = false }
whereat = { version = "0.1.5", default-features = false }
bytemuck = { version = "1.25.2", default-features = false, features = ["extern_crate_alloc"] }
libm = { version = "0.2.16", default-features = false }
