[package]
name = "zenpixels"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../README.crates.md"
repository.workspace = true
categories.workspace = true
description = "Greenfield pixel, color-space, and zero-copy buffer interchange types for Rust image pipelines"
keywords = ["image", "pixel", "color", "hdr", "codec"]
include = [
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/src/**",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std", "icc"]
std = []
icc = []
rgb = ["dep:rgb"]
imgref = ["dep:imgref", "rgb"]
image = ["dep:image", "std"]

[dependencies]
bytemuck = { version = "1.21", default-features = false, features = ["extern_crate_alloc", "derive"] }
rgb = { version = "0.8.53", default-features = false, features = ["bytemuck"], optional = true }
imgref = { version = "1.12", optional = true }
image = { version = "0.25.10", default-features = false, optional = true }
whereat = { version = "0.1.5", default-features = false }

[dev-dependencies]
image = { version = "0.25.10", default-features = false }
imgref = "1.12"
rgb = { version = "0.8.53", default-features = false, features = ["bytemuck"] }
