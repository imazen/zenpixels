[package]
name = "zenpixels"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../README.crates.md"
repository.workspace = true
categories.workspace = true
description = "Pixel format interchange types for zen* codecs"
keywords = ["image", "pixel", "format", "descriptor", "codec"]
include = [
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/src/**",
]

[features]
default = ["std", "icc"]
std = ["zenhash?/std"]
# Pixel fingerprints and Hash impls; this opt-in feature requires Rust 1.89.
hash = ["dep:zenhash", "zenhash/murmur3"]
# Retained feature spelling for shared 0.2/0.3 consumer manifests; no API.
planar = []
icc = []
rgb = ["dep:rgb"]
imgref = ["dep:imgref", "rgb"]
# `Vec<T, A>` and `Box<T, A>` as sample storage on Rust 1.100 or newer. On older
# compilers it has no effect, so `--all-features` keeps working.
allocator_api = ["dep:rustversion"]
# Conversions to and from `image` 0.25, which needs Rust 1.88.
image = ["dep:image", "std"]
# Soft-removed in 0.2.16 (unreleased at the time; crates.io latest was
# 0.2.14, whose builds are unaffected). The `serde` feature previously pulled an optional
# `serde` dependency and added `Serialize`/`Deserialize` derives on the
# descriptor/CICP/HDR-metadata types. A 2026-07 sweep of every Cargo.toml,
# CI workflow, and Rust source under ~/work found ZERO consumers enabling
# it (no `features = ["serde"]`, no `zenpixels/serde` forwarding, no code
# serializing these types) — the derives were pure speculative surface.
# Kept as an empty stub so any external consumer that wrote
# `features = ["serde"]` still builds; the feature does nothing and is
# queued for hard removal in 0.3.0. Mirrors the zenpixels-convert 0.2.15
# soft-removal precedent.
serde = []

[dependencies]
zenhash = { git = "https://github.com/imazen/zenhash", rev = "98c385a4e54a", default-features = false, features = ["xxh3", "avx512"], optional = true }
bytemuck = { version = "1.21", default-features = false, features = ["extern_crate_alloc", "derive"] }
rgb = { version = "0.8", default-features = false, features = ["bytemuck"], optional = true }
imgref = { version = "1.12", optional = true }
rustversion = { version = "1.0.23", optional = true }
image = { version = "0.25.10", default-features = false, optional = true }
whereat = { version = "0.1.5", default-features = false }

[dev-dependencies]
# Always test the `image` and `allocator_api` code, on plain `cargo test` too.
zenpixels = { path = ".", features = ["image", "allocator_api"] }
image = { version = "0.25.10", default-features = false }
rustversion = "1.0.23"
imgref = "1.12"
rgb = { version = "0.8", default-features = false, features = ["bytemuck"] }

[[test]]
name = "typed_extraction_contract"
required-features = ["rgb"]
