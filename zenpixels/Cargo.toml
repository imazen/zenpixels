[package]
name = "zenpixels"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../README.crates.md"
repository.workspace = true
categories.workspace = true
description = "Pixel format interchange types for zen* codecs"
keywords = ["image", "pixel", "format", "descriptor", "codec"]
include = [
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/src/**",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std", "icc"]
std = ["zenhash?/std"]
# Pixel fingerprints and Hash impls; this opt-in feature requires Rust 1.89.
hash = ["dep:zenhash", "zenhash/murmur3"]
# Multi-plane layouts, native planes (`zenpixels::plane`), and bit-packed integer
# code views (`CodePlane`, `CodePlaneMut`); off by default for faster packed-only builds.
planar = []
# Perceptual and cylindrical color-space descriptors (`Oklch`, `Lch`,
# `Jzazbz`, `Jzczhz`, `Hsl`, `Hsv` on `ChannelLayout` and `ColorModel`).
# Off by default; `zenpixels-convert`'s `perceptual` feature enables this automatically.
perceptual = []
icc = []
rgb = ["dep:rgb"]
imgref = ["dep:imgref", "rgb"]
# `Vec<T, A>` and `Box<T, A>` as sample storage on Rust 1.100 or newer. On older
# compilers it has no effect, so `--all-features` keeps working.
allocator_api = ["dep:rustversion"]
# Conversions to and from `image` 0.25, which needs Rust 1.88.
image = ["dep:image", "std"]

[dependencies]
zenhash = { git = "https://github.com/imazen/zenhash", rev = "98c385a4e54a", default-features = false, features = ["xxh3", "avx512"], optional = true }
bytemuck = { version = "1.21", default-features = false, features = ["extern_crate_alloc", "derive"] }
rgb = { version = "0.8.53", default-features = false, features = ["bytemuck"], optional = true }
imgref = { version = "1.12", optional = true }
rustversion = { version = "1.0.23", optional = true }
image = { version = "0.25.10", default-features = false, optional = true }
whereat = { version = "0.1.5", default-features = false }

[dev-dependencies]
# Always test the `image` and `allocator_api` code, on plain `cargo test` too.
zenpixels = { path = ".", features = ["image", "allocator_api"] }
image = { version = "0.25.10", default-features = false }
rustversion = "1.0.23"
imgref = "1.12"
rgb = { version = "0.8.53", default-features = false, features = ["bytemuck"] }

[[test]]
name = "typed_extraction_contract"
required-features = ["rgb"]

[[test]]
name = "alloc_failure_typed"
required-features = ["rgb"]

[[test]]
name = "planes"
required-features = ["planar"]

[[test]]
name = "planar_picture"
required-features = ["planar"]

[[test]]
name = "planar_buffer"
required-features = ["planar"]

[[test]]
name = "native_codes"
required-features = ["planar"]

[[test]]
name = "code_planes"
required-features = ["planar"]

[[test]]
name = "storage_symmetry"
required-features = ["planar"]
