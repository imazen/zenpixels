[package]
name = "icc-gen"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
publish = false
description = "Internal tool: regenerate zenpixels ICC profile hash tables from a corpus of ICC profiles"

[features]
default = ["lcms2-crosscheck"]
# lcms2 cross-checking (AND-gate: require moxcms AND lcms2 to both agree
# with the canonical synth reference). Requires the Little CMS 2 C library
# installed system-wide (e.g., `apt install liblcms2-dev` on Debian/Ubuntu,
# `brew install little-cms2` on macOS).
#
# Disable with `--no-default-features` if the C library is unavailable; the
# generator still runs on moxcms alone and produces the same table on our
# current corpus, at the cost of losing the independent-CMS sanity check.
lcms2-crosscheck = ["dep:lcms2", "dep:bytemuck"]

[dependencies]
moxcms = { version = ">=0.8.1, <0.10", features = ["options"] }
lcms2 = { version = "6.1.1", optional = true }
bytemuck = { version = "1.18.0", optional = true }
# Build-time only: pure-Rust LZ4 block compression for the CICP bundle
# generator (`cicp_bundle_gen` bin). Same `lz4_flex` used at runtime, so the
# whole pipeline is one safe LZ4 implementation with no C dependency. `std` is
# fine here (this is a host build tool); `safe-encode`/`safe-decode` keep it
# unsafe-free.
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode"] }

# Default binary: the ICC hash-table generator (src/main.rs).
[[bin]]
name = "icc-gen"
path = "src/main.rs"

# CICP→ICC bundle generator: emits the transfer-grouped LZ4 blob + index.
[[bin]]
name = "cicp_bundle_gen"
path = "src/bin/cicp_bundle_gen.rs"
