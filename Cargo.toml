[workspace]
members = ["zenpixels", "zenpixels-convert", "scripts/icc-gen"]
# `apidoc/` is the CI-free public-API snapshot runner: excluded so plain
# `cargo test` and CI never compile its zenutils-apidoc dependency tree.
# Regenerate snapshots via `just api-doc`.
# `benchmarks/transpose-shootout/` is dev-box-only measurement equipment
# (external transpose crates + optional C++ Simd FFI) — never built by CI/tests.
# `cms-contract/` compares the production CMS backends; `just cms-contract`.
exclude = ["benchmarks/pixel-hash", "zenpsy-api", "benchmarks/moxcms-gamma", "site/converter-wasm", "apidoc", "benchmarks/transpose-shootout", "cms-contract", "tools/icc-collapse-no-db"]
resolver = "2"

[workspace.dependencies]
zenpixels = { path = "zenpixels", version = "0.4.0", default-features = false }

# NOTE: no shared `version` here on purpose — each member declares its own
# version (they release independently), so a workspace-level one only rots.
[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/imazen/zenpixels"
categories = ["multimedia::images"]

# Post-release garb numerical fixes and precise-portable kernels still require
# these source revisions; the SIMD dependencies now resolve stable 0.9.31.
[patch.crates-io]
archmage = { git = "https://github.com/imazen/archmage", rev = "303341570757936368fca1ee7254a19075cbff08" }
magetypes = { git = "https://github.com/imazen/archmage", rev = "303341570757936368fca1ee7254a19075cbff08" }
garb = { git = "https://github.com/imazen/garb", rev = "f22a8c5412de72255de80b5597a484c796f4e40d" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "360fb968cda351b2e161d10e66b36414f4d3b9e7" }
