[workspace]
members = ["zenpixels", "zenpixels-convert", "scripts/icc-gen"]
# `apidoc/` is the CI-free public-API snapshot runner: excluded so plain
# `cargo test` and CI never compile its zenutils-apidoc dependency tree.
# Regenerate snapshots via `just api-doc`.
# `benchmarks/transpose-shootout/` is dev-box-only measurement equipment
# (external transpose crates + optional C++ Simd FFI) — never built by CI/tests.
exclude = ["apidoc", "benchmarks/transpose-shootout"]
resolver = "2"

[workspace.dependencies]
zenpixels = { path = "zenpixels", version = "0.2.16", default-features = false }

# Patches: only consulted when the corresponding crate is actually pulled.
# When `zenpixels-convert`'s `__hdr-e2e-test` feature pulls the local
# `zenjpeg` it transitively requires the unpublished main of `ultrahdr-core`
# (via `zenjpeg`'s `ultrahdr` feature), which is patched in. `zencodec` is
# NOT patched: 0.1.24 is on crates.io now, so the transitive graph resolves
# it from the registry. The patches are NO-OPS for default builds — cargo
# only consults them when those crates appear in the dep graph. Deliberately
# omitting a `zenpixels-convert` patch here so transitive `zenanalyze →
# zenpixels-convert ^0.2.11` still resolves to the registry copy and
# we don't form a self-cycle through the local crate.
[patch.crates-io]
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr" }
# Patch `zenpixels` to the local member so its `ColorPrimaries` enum is
# the same type the test calls into. We deliberately do NOT patch
# `zenpixels-convert` here — that would form a cycle through
# `zenanalyze`. The two-version `zenpixels-convert` graph (local 0.2.15
# for the workspace member + registry 0.2.14 for zenanalyze's transitive
# need) is harmless because the test only ever uses the local copy
# directly.
zenpixels = { path = "zenpixels" }

[workspace.package]
version = "0.2.11"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/imazen/zenpixels"
categories = ["multimedia::images"]
