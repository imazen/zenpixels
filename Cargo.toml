[workspace]
members = ["zenpixels", "zenpixels-convert", "scripts/icc-gen"]
# `apidoc/` is the CI-free public-API snapshot runner: excluded so plain
# `cargo test` and CI never compile its zenutils-apidoc dependency tree.
# Regenerate snapshots via `just api-doc`.
# `benchmarks/transpose-shootout/` is dev-box-only measurement equipment
# (external transpose crates + optional C++ Simd FFI) — never built by CI/tests.
# `cms-contract/` runs the pure-Rust lcms port against the trait; `just cms-contract`.
exclude = ["benchmarks/moxcms-gamma", "site/converter-wasm", "apidoc", "benchmarks/transpose-shootout", "cms-contract"]
resolver = "2"

[workspace.dependencies]
zenpixels = { path = "zenpixels", version = "0.3.1", default-features = false }

# NOTE: no shared `version` here on purpose — each member declares its own
# version (they release independently), so a workspace-level one only rots.
[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/imazen/zenpixels"
categories = ["multimedia::images"]

# Unpublished garb APIs and precise-portable transfer kernels still require
# these source revisions; the SIMD dependencies now resolve stable 0.9.31.
[patch.crates-io]
garb = { git = "https://github.com/imazen/garb", rev = "58ce9cad7b337418a7abe9b1f6e3e4bd1928b385" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "52896f4b24664315586bd60e5f048253b1f69052" }
