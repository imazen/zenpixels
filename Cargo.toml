[workspace]
members = ["zenpixels", "zenpixels-convert"]
exclude = [
    "scripts/icc-gen",
    "benchmarks/pixel-hash",
    "zenpsy-api",
    "benchmarks/moxcms-gamma",
    "site/converter-wasm",
    "apidoc",
    "benchmarks/transpose-shootout",
    "cms-contract",
    "tools/icc-collapse-no-db",
]
resolver = "2"

[workspace.dependencies]
zenpixels = { path = "zenpixels", version = "0.5.0", default-features = false }

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/imazen/zenpixels"
categories = ["multimedia::images"]

[patch.crates-io]
garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585" }
