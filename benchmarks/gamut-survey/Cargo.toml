[package]
name = "gamut-survey"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
moxcms = { version = "0.9.1", features = ["options", "extended_range"] }
moxlocal = { package = "moxcms", git = "https://github.com/lilith/moxcms", rev = "dbc150b6b7a28e75a878d66d50cc8e94870885ef", features = ["options", "extended_range"] }
zenpixels = { path = "../../zenpixels", default-features = false }
zenpixels-convert = { path = "../../zenpixels-convert", default-features = false, features = ["std", "hdr-experimental"] }
zenbench = "0.1.11"
serde_json = "1.0.145"
bytemuck = "1.25.2"
[patch.crates-io]
garb = { git = "https://github.com/imazen/garb", rev = "605276d717ea0b31a1cd2a36ae05301383c7b8b5" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "52896f4b24664315586bd60e5f048253b1f69052" }
[profile.release]
lto = "thin"
codegen-units = 1
[features]
size-css = []
size-ott = []
size-soft = []
