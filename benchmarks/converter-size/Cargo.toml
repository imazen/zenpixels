[package]
name = "cs"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
zenpixels = { path = "../../zenpixels", default-features = false }
zenpixels-convert = { path = "../../zenpixels-convert", default-features = false, features = ["rgb"] }
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
debug = 2
