[package]
name = "cs"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
zenpixels = { path = "../../zenpixels", default-features = false }
zenpixels-convert = { path = "../../zenpixels-convert", default-features = false, features = ["rgb"] }
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
debug = 2

[patch.crates-io]
garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "f2430c90e1f2627bcf553e3a5d32349cf94faeb2" }
