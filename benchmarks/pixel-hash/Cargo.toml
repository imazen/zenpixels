[package]
name = "pixel-hash-bench"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false

[workspace]

[dependencies]
zenpixels = { path = "../../zenpixels", features = ["hash"] }
zenhash = { git = "https://github.com/imazen/zenhash", rev = "98c385a4e54a", default-features = false, features = ["std", "avx512", "rapidhash", "xxh3", "fnv", "murmur3"] }
zenpixels-before = { package = "zenpixels", git = "https://github.com/imazen/zenpixels", rev = "e853eb7545668f46550aa72e42897fa30ebba8de", features = ["hash"] }
zenhash-next = { package = "zenhash", git = "https://github.com/imazen/zenhash", rev = "1836e2fa31d8", default-features = false, features = ["std", "avx512", "xxh3", "fnv", "murmur3"] }
zenbench = "0.1.11"
bytemuck = "1.25.2"

[[bench]]
name = "pixel_hash"
path = "src/main.rs"
harness = false

[profile.bench]
lto = "thin"

[[bin]]
name = "profile_codes"
path = "src/profile_codes.rs"

[[bench]]
name = "regressions"
path = "src/regressions.rs"
harness = false
