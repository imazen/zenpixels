[package]
name = "zenpixels-convert"
version = "0.5.0"
edition.workspace = true
rust-version = "1.89"
license.workspace = true
readme = "README.crates.md"
repository.workspace = true
categories.workspace = true
description = "Greenfield 0.5 transfer-function-aware pixel conversion, HDR tone mapping, gamut mapping, and codec negotiation for zenpixels"
keywords = ["image", "pixel", "conversion", "srgb", "hdr"]
include = [
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/src/**",
    "/README.crates.md",
]

[package.metadata.docs.rs]
features = [
    "oklab",
    "hdr-transfers",
    "perceptual",
    "icc-db",
    "bt2446a",
    "cms-moxcms",
    "cms-lcms",
    "rgb",
    "imgref",
    "fast-transpose",
]

[features]
default = ["std", "fast-transpose", "oklab", "hdr-transfers"]
# Oklab color-space conversions and OKLch soft gamut compression.
oklab = []
# PQ (SMPTE ST 2084) and HLG (ARIB STD-B67 + BT.2100 display rendering) transfers.
hdr-transfers = []
# Perceptual / cylindrical color spaces (Oklch, CIE Lab/Lch, Jzazbz/Jzczhz, HSL, HSV).
perceptual = ["oklab", "hdr-transfers"]
# Committed CICP->ICC profile database (LZ4-compressed bundle).
icc-db = ["dep:lz4_flex"]
std = ["zenpixels/std", "linear-srgb/std", "garb/std", "archmage/std", "magetypes/std", "magemath/std"]
# SIMD transpose kernels behind orient::apply_orientation*.
fast-transpose = []
# AVX-512F F16C & vector tiers.
avx512 = ["magetypes/avx512", "archmage/avx512", "magemath/avx512", "linear-srgb/avx512"]
# Portable bit-exact FMA on strict WASM.
precise-portable = ["linear-srgb/precise-portable"]
rgb = ["zenpixels/rgb", "dep:rgb"]
imgref = ["zenpixels/imgref", "rgb"]
# Built-in ITU-R BT.2446 Method A HDR->SDR tone mapper.
bt2446a = ["oklab", "hdr-transfers"]
# Pure-Rust moxcms ICC CMS backend.
cms-moxcms = ["std", "dep:moxcms"]
# Pure-Rust lcms ICC CMS backend.
cms-lcms = ["std", "dep:lcms"]
# Enable full SIMD acceleration by default (default-off so library crates dead-strip unused SIMD).
fast = []

[dependencies]
enough = { version = "0.4.4", default-features = false }
zenpixels = { workspace = true, default-features = false, features = ["icc"] }
linear-srgb = { version = "0.6.13", git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585", default-features = false, features = ["transfer"] }
bytemuck = { version = "1.21", default-features = false, features = ["extern_crate_alloc", "derive"] }
rgb = { version = "0.8.53", default-features = false, features = ["bytemuck"], optional = true }
garb = { version = "0.2.9", git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa", default-features = false }
archmage = { version = "0.9.33", default-features = false }
libm = { version = "0.2", default-features = false }
magetypes = { version = "0.9.33", default-features = false }
magemath = { version = "0.1.1", default-features = false }
paste = { package = "pastey", version = "0.2.3" }
once_cell = { version = "1.21.4", default-features = false, features = ["race", "alloc"] }
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-decode"], optional = true }
whereat = { version = "0.1.5", default-features = false }
moxcms = { version = "0.9.2", optional = true, features = ["options", "extended_range"] }
lcms = { version = "0.0.0", git = "https://github.com/imazen/lcms", rev = "55b59476cf64920345e9ca32eb3a4678bf0bbece", optional = true }

[dev-dependencies]
zenpixels = { workspace = true, features = ["imgref", "image"] }
zenbench = { version = "0.1.11" }
archmage = { version = "0.9.33", features = ["testable_dispatch"] }
half = "2.7.1"
allocation-counter = "0.8.1"
sha2 = "0.11.0"
