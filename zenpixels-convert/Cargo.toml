[package]
name = "zenpixels-convert"
version = "0.2.15"
edition.workspace = true
rust-version = "1.89"
license.workspace = true
readme = "README.md"
repository.workspace = true
categories.workspace = true
description = "Transfer-function-aware pixel conversion, gamut mapping, and codec format negotiation for zenpixels"
keywords = ["image", "pixel", "conversion", "srgb", "codec"]
include = [
    "/src/**",
    "/benches/*.rs",
    "/README.md",
]

[features]
default = ["std", "icc-db"]
# The committed CICP->ICC profile database: the LZ4-compressed bundle
# (~36 KB asset) + its lazy decode machinery, giving synthesize_icc_for_cicp /
# synthesize_gray_icc_for_cicp full assigned-H.273-grid coverage with no CMS.
# Disable (default-features = false) for size-sensitive / wasm builds: the
# synthesize fns then answer NeedsCms outside the sRGB default and the four
# bundled consts, and the load-bearing gray-ICC swap degrades to suppressing
# the collapse for ICC-bearing sources.
icc-db = ["dep:lz4_flex"]
std = ["zenpixels/std", "linear-srgb/std", "garb/std"]
# SIMD transpose kernels (x86-64 AVX2 + aarch64 NEON) behind apply_orientation*.
# Opt-in: without it, apply_orientation* use the portable scalar tiled/blocked
# paths (correct, slower). archmage/magetypes are ALREADY unconditional deps (the
# gamut/f16 SIMD paths pull them), so enabling this adds ~0 compile time and only
# ~36 KB of .text — for 1.1-4.7× faster transposes (biggest at thumbnail→mid sizes;
# memory-bound by 12MP). Output is bit-identical. Default-on is queued for 0.3.0;
# see benchmarks/orient_fast_transpose_2026-06-18.md + orient/{pxn_x86,pxn_neon,rgb3_x86}.rs.
fast-transpose = []
# Unlocks the f16 16-wide AVX-512F summon-up inside the V3 `F16Convert` slice
# entry (magetypes' `avx512` kernels are cfg-gated on this; it transitively
# brings `archmage/avx512` for the V4 token tier). The f16 forwarders in
# f16_scalar.rs carry `v4(cfg(avx512))` to pick up the wider path; every other
# `incant!` site in fast_gamut.rs explicitly drops v4 with `[-v4]` (those
# kernels are hardwired 8-wide AVX2 — no clean 16-wide variant, so no `_v4` is
# defined for them). x86 without this feature still gets 8-wide F16C; aarch64
# gets NEON-fp16 regardless.
avx512 = ["magetypes/avx512", "archmage/avx512"]
rgb = ["zenpixels/rgb", "dep:rgb"]
imgref = ["zenpixels/imgref", "rgb"]
planar = ["zenpixels/planar"]
pipeline = []
# Experimental HDR analysis surface (gates `hdr::measure` — the `CllMeasure`
# extension trait + `LightLevelHistogram` / `LightLevelMethod` + the SIMD
# CLL scan kernel). The underlying scan + accuracy contracts are stable —
# the gate covers expected pre-0.3.0 shape churn (the queued
# `measure_robust` → `measure` rename when `zenpixels::ContentLightLevel`'s
# deprecated 2-arg `measure` ships its 0.3.0 removal, plus potential trait-
# vs-free-fn restructuring). Default-off; opt in with
# `features = ["hdr-experimental"]` to access measurement until the API
# locks at 0.3.0.
hdr-experimental = []
cms-moxcms = ["std", "dep:moxcms"]
serde = ["dep:serde", "zenpixels/serde"]
# Bench-only: exposes `pub mod __bench_u16_hybrids` shims for
# `bench_u16_hybrids`. Not intended for non-bench use; the production u16
# RGB gamut path uses `convert_u16_rgb_simd_lutdec_polyenc` directly.
__bench_u16_hybrids = []
# Internal: enables runtime op tracing for in-repo tests. ConvertSteps
# executed during convert_row are recorded to a thread-local buffer.
# Off by default; the recording function compiles to an empty body when
# disabled, keeping production builds zero-overhead. Requires `std`.
# `__` prefix follows the same internal-API convention as
# `__bench_u16_hybrids`. Not part of the stable public surface.
__trace_ops = ["std"]
# Bench-only: exposes the `orient::__bench_apply_orientation_*` shims so
# `bench_orient` can A/B `apply_orientation` against the scalar `forward_map`
# oracle. Decoupled from `fast-transpose` so the bench measures BOTH paths:
# `--features __bench_orient` → scalar tiled gather; add `,fast-transpose` → SIMD
# kernels. The staged shim + its parity test require both features. `__` prefix
# keeps it out of the public-API snapshot.
__bench_orient = []
# Bench-only: exposes `pub mod __bench_scan` shims for
# `bench_load_bearing`. Same convention as `__bench_u16_hybrids`.
__bench_scan = []
# Test-only: enables the producer-SDR end-to-end ΔE2000 regression test
# for `hdr::HdrToSdr` (`tests/hdr_producer_sdr_match.rs`). Requires the
# `imazen-26` gain-map corpus on disk at
# `/home/lilith/work/codec-corpus/imazen-26/` (silently skipped at runtime
# if the sample is absent, but the test must pass on `lilith`'s machine
# where the corpus exists). Pulls `zencodecs` (with `jpeg-ultrahdr`) and
# `anyhow` so the e2e decode path compiles only when this feature is on.
# `__` prefix keeps it out of the public-API snapshot. **MUST be run on
# `lilith`'s machine before merging any pipeline-touching change.**
__hdr-e2e-test = ["hdr-experimental", "dep:zenjpeg", "dep:anyhow"]

[dependencies]
zenpixels = { workspace = true, default-features = false, features = ["icc"] }
linear-srgb = { version = "0.6.12", default-features = false, features = ["transfer"] }
bytemuck = { version = "1.21", default-features = false, features = ["extern_crate_alloc", "derive"] }
rgb = { version = "0.8", default-features = false, features = ["bytemuck"], optional = true }
garb = { version = "0.2.8", default-features = false, features = ["experimental"] }
archmage = { version = "0.9.26", default-features = false }
# Direct libm dep for the hdr-experimental Bt2446A / HdrToSdr scalar paths
# (powf, logf, log2f, cosf, sinf). The crate is no_std and already pulled in
# transitively by magetypes; we depend on it directly so the math calls don't
# reach across an unstable boundary.
libm = { version = "0.2", default-features = false }
# 0.9.25 adds the F16Convert trait: hardware f16<->f32 slice converters with
# native F16C (x86-64-v3) AND NEON-fp16 (aarch64, rustversion-gated, MSRV-safe)
# backends + a branchless software fallback — replacing this crate's bespoke
# x86-only F16C dispatch (which fell back to scalar on aarch64).
# Deliberately no `w512`: the `scan` predicates use 256-bit types (native
# on AVX2, 2×128 polyfill below), and the 512-bit type set isn't worth its
# compile-time cost without a stronger AVX-512 use case in this crate.
magetypes = { version = "0.9.26", default-features = false }
paste = "1.0.15"
once_cell = { version = "1.21.4", default-features = false, features = ["race", "alloc"] }
# Pure-Rust LZ4 safe-decode for the bundled CICP->ICC profile blob. no_std
# (block format only); decodes the standard LZ4 blocks emitted by the icc-gen
# `cicp_bundle_gen` build tool. The `safe-decode` feature keeps us inside
# `#![forbid(unsafe_code)]`.
lz4_flex = { version = "0.13.1", default-features = false, features = ["safe-decode"], optional = true }
whereat = { version = "0.1.5", default-features = false }
moxcms = { version = ">=0.8.1, <0.10", optional = true, features = ["options"] }
# Optional `serde` derive support for crate-local enums (currently
# `hdr::measure::LightLevelMethod`). Pulled in when the `serde` feature
# is enabled — without it the `derive(serde::Serialize, serde::Deserialize)`
# in `LightLevelMethod` failed to resolve under `--features
# serde,hdr-experimental` (the `serde` feature previously only forwarded
# to `zenpixels/serde`). `no_std`-compatible via `default-features = false`.
serde = { version = "1.0", default-features = false, optional = true, features = ["derive"] }
# Test-only optional deps for `__hdr-e2e-test` (see the feature comment
# above). Used exclusively by `tests/hdr_producer_sdr_match.rs`; not
# linked into any runtime code path. We pull `zenjpeg` from the local
# path (workspace sibling) so we get the latest `ultrahdr_core` re-exports
# (one-call `decode_ultrahdr` / `decode_ultrahdr_hdr` + `apply_gainmap`
# returning `PixelBuffer`). The transitive `zenanalyze → zenpixels-convert
# ^0.2.11` requirement is satisfied from crates.io 0.2.14, so the local
# `zenpixels-convert` 0.2.15 + registry 0.2.14 coexist without forming a
# cycle (we deliberately do NOT add a `zenpixels-convert` entry in the
# workspace `[patch.crates-io]` table — that's what would create the
# `zenpixels-convert → zenjpeg → zenanalyze → zenpixels-convert` cycle).
zenjpeg = { version = "0.8.4", optional = true, default-features = false, features = ["decoder", "ultrahdr"] }
anyhow = { version = "1.0", optional = true }

[dev-dependencies]
zenpixels = { workspace = true, features = ["planar", "imgref"] }
zenpixels-convert = { path = ".", features = ["pipeline", "imgref", "cms-moxcms"] }
zenbench = { version = "0.1.2"}
# Dev-only: cross-validate our local f16 impl (src/f16_scalar.rs) and drive
# the perceptual-loss test suite, which uses half's f64 conversion paths.
half = "2.7.1"
palette = { version = "0.7", default-features = false, features = ["std", "approx"] }
# Dev-only: pin the committed CICP bundle blob's sha256 (golden test) so an
# accidental regen is caught. Not part of the shipped crate.
sha2 = "0.11.0"
# Dev-only: drive the serde round-trip tests in tests/serde_feature.rs
# (verifying that the `serde` feature compiles with `hdr-experimental` so
# `LightLevelMethod` and `ContentLightLevel` are serializable). Not pulled
# in by the production build; only consumed by the test target.
serde_json = "1.0.150"

