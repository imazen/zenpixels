[package]
name = "zenpixels-convert-e2e"
# Never published; this crate exists solely so the main `zenpixels-convert`
# Cargo.toml stays free of test-only optional deps (`zenjpeg`, `anyhow`).
version = "0.0.0"
edition.workspace = true
rust-version = "1.89"
license.workspace = true
description = "End-to-end test harness for zenpixels-convert HDR pipeline; never published."
publish = false

# Empty `src/lib.rs` stub; all the action is in `tests/`. We declare a
# `[lib]` so `cargo` accepts the crate (otherwise a crate with no targets
# fails to resolve).
[lib]
path = "src/lib.rs"

[dev-dependencies]
zenpixels-convert = { path = "../zenpixels-convert", features = ["hdr-experimental"] }
zenpixels = { path = "../zenpixels" }
# Local zenjpeg (path to the sibling repo at ../../zenjpeg/zenjpeg) so the
# test sees the latest `ultrahdr_core` re-exports (`decode_ultrahdr` /
# `decode_ultrahdr_hdr` / `apply_gainmap` → `PixelBuffer`) — the published
# 0.8.4 on crates.io predates them. The workspace `[patch.crates-io]` entry
# for `ultrahdr-core` carries over: zenjpeg's `ultrahdr` feature pulls the
# unpublished `ultrahdr-core` main, which is patched in at the workspace root.
zenjpeg = { path = "../../zenjpeg/zenjpeg", default-features = false, features = ["decoder", "ultrahdr"] }
anyhow = "1.0"
bytemuck = { version = "1.21", default-features = false }
