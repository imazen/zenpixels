# CI-free public-API snapshot runner — the only package depending on
# zenutils-apidoc. The real workspace `exclude`s this directory, so plain
# `cargo test` and every CI job (including --all-features ones) never
# compile the apidoc tree or run rustdoc. Regenerate via `just api-doc`.
[package]
name = "zenpixels-apidoc"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# Switch back to `version = "0.1.2"` once `zenutils-apidoc 0.1.2` is on
# crates.io. The path is needed today because `no_file_meta_header()` /
# `no_autotraits_summary()` (added 2026-06-25) are not yet published.
zenutils-apidoc = { path = "../../zenutils/zenutils-apidoc" }

# Self-contained: never joins the parent workspace, even if the parent's
# `exclude` entry goes missing.
[workspace]
