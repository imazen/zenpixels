[package]
name = "pixel-explorer-converter"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
wasm-bindgen = "=0.2.130"
serde_json = "=1.0.154"
zenpixels = { path = "../../zenpixels" }
zenpixels-convert = { path = "../../zenpixels-convert", features = ["bt2446a"] }

[patch.crates-io]
garb = { git = "https://github.com/imazen/garb", rev = "58ce9cad7b337418a7abe9b1f6e3e4bd1928b385" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "52896f4b24664315586bd60e5f048253b1f69052" }

[profile.release]
lto = "thin"
opt-level = "s"
