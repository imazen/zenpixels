[package]
name = "pixel-explorer-converter"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
wasm-bindgen = "=0.2.130"
serde_json = "=1.0.154"
zenpixels = { path = "../../zenpixels", features = ["planar"] }
zenpixels-convert = { path = "../../zenpixels-convert", features = ["bt2446a", "planar"] }

[patch.crates-io]
garb = { git = "https://github.com/imazen/garb", rev = "a21a9f701e09ad01acb661276f0143ddd1e9095a" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "2b3a993b5d55c290c08f62718ccf3d4c3f522d30" }

[profile.release]
lto = "thin"
opt-level = "s"
