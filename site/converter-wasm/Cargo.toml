[package]
name = "pixel-explorer-converter"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
wasm-bindgen = "=0.2.130"
serde_json = "=1.0.154"
zenpixels = { path = "../../zenpixels", features = ["planar"] }
zenpixels-convert = { path = "../../zenpixels-convert", features = ["bt2446a", "planar", "perceptual"] }

[patch.crates-io]
garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585" }

[profile.release]
lto = "thin"
opt-level = "s"
