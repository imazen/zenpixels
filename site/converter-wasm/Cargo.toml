[package]
name = "pixel-explorer-converter"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
wasm-bindgen = "=0.2.130"
serde_json = "=1.0.154"
zenpixels = { path = "../../zenpixels", features = ["planar"] }
zenpixels-convert = { path = "../../zenpixels-convert", features = ["bt2446a", "planar"] }

[patch.crates-io]
garb = { git = "https://github.com/imazen/garb", rev = "aa685891a04028ce747e9bf1bd0024e31ab6c439" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "abd98dd1af9e958d11912245d6d523b075b67ad1" }

[profile.release]
lto = "thin"
opt-level = "s"
