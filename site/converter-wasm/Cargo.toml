[package]
name = "pixel-explorer-converter"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
wasm-bindgen = "=0.2.130"
serde_json = "=1.0.154"
zenpixels = { path = "../../zenpixels", features = ["planar"] }
zenpixels-convert = { path = "../../zenpixels-convert", features = ["bt2446a", "planar"] }

[patch.crates-io]
archmage = { git = "https://github.com/imazen/archmage", rev = "a6be44993d8d3f8dba9a458f898d200fccba5b31" }
magetypes = { git = "https://github.com/imazen/archmage", rev = "a6be44993d8d3f8dba9a458f898d200fccba5b31" }
garb = { git = "https://github.com/imazen/garb", rev = "f22a8c5412de72255de80b5597a484c796f4e40d" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "52896f4b24664315586bd60e5f048253b1f69052" }

[profile.release]
lto = "thin"
opt-level = "s"
