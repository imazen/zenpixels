[package]
name = "pixel-explorer-converter"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
wasm-bindgen = "=0.2.130"
serde_json = "=1.0.154"
zenpixels = { path = "../../zenpixels", features = ["planar"] }
zenpixels-convert = { path = "../../zenpixels-convert", features = ["bt2446a", "planar"] }

[patch.crates-io]
garb = { git = "https://github.com/imazen/garb", rev = "c6bdf1a311fd853e992f03084bdbb2b0792f0817" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "fd4c475a699bbb41cacaba6e53f24c63bffab67a" }

[profile.release]
lto = "thin"
opt-level = "s"
