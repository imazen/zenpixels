[package]
name = "zenpsy-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/imazen/zenpixels"
description = "Typed still-image quality results and optional prepared references"
publish = false

[workspace]

[features]
default = []
std = ["zenpixels/std"]

[dependencies]
zenpixels = { path = "../zenpixels", version = "0.3.1", default-features = false }
how-far = { version = "0.1.0", default-features = false }
whereat = { version = "0.1.5", default-features = false }
