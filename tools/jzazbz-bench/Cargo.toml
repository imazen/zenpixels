# JzAzBz vs XYB forward-transform speed and f64 accuracy gate.
# Standalone diagnostic; historical measurements retain their original pins.
# Run: cargo run --release --manifest-path tools/jzazbz-bench/Cargo.toml
[package]
name = "jzazbz-bench"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace]

[dependencies]
archmage = "0.9.31"
magetypes = "0.9.31"
zenbench = "0.1.2"

[profile.release]
debug = 1
