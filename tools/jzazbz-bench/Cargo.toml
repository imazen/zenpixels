# JzAzBz vs XYB forward-transform speed + f64 accuracy gate. Standalone (own
# workspace) because it pins the archmage/magetypes 0.9.31 beta for
# `#[attune]`, which garb 0.2.8 / linear-srgb 0.6.12 (`^0.9.2x`, no
# prereleases) keep out of the zenpixels lockfile. Uses no zenpixels code.
# Run: cargo run --release --manifest-path tools/jzazbz-bench/Cargo.toml
[package]
name = "jzazbz-bench"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace]

[dependencies]
archmage = "=0.9.31-beta.1"
magetypes = "=0.9.31-beta.1"
zenbench = "0.1.2"

[profile.release]
debug = 1
