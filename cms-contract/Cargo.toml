[package]
name = "cms-contract"
version = "0.0.0"
edition = "2024"
publish = false
description = "Runs every PluggableCms backend through one behavioral contract and compares them"

# Standalone comparison runner; the production LCMS backend is separately opt-in.
[workspace]

[dependencies]
zenpixels = { path = "../zenpixels" }
zenpixels-convert = { path = "../zenpixels-convert", features = ["icc-db", "cms-moxcms", "cms-lcms"] }
lcms = { git = "https://github.com/imazen/lcms", rev = "55b59476cf64920345e9ca32eb3a4678bf0bbece" }
moxcms = "0.9.2"
whereat = "0.1"
bytemuck = "1.21"
archmage = "0.9.31"

[patch.crates-io]
archmage = { git = "https://github.com/imazen/archmage", rev = "303341570757936368fca1ee7254a19075cbff08" }
magetypes = { git = "https://github.com/imazen/archmage", rev = "303341570757936368fca1ee7254a19075cbff08" }
garb = { git = "https://github.com/imazen/garb", rev = "127c1f77e011c24b505b32ed572e694700789e0a" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "360fb968cda351b2e161d10e66b36414f4d3b9e7" }

[dev-dependencies]
zenbench = "0.1.11"
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-decode"] }

[[bench]]
name = "icc_synthesis"
harness = false
