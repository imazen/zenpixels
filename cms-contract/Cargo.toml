[package]
name = "cms-contract"
version = "0.0.0"
edition = "2024"
publish = false
description = "Runs every PluggableCms backend through one behavioral contract and compares them"

# Standalone comparison runner; the production LCMS backend is separately opt-in.
[workspace]

[dependencies]
zenpixels = { path = "../zenpixels" }
zenpixels-convert = { path = "../zenpixels-convert", features = ["cms-moxcms", "cms-lcms"] }
lcms = { git = "https://github.com/imazen/lcms", rev = "39068cc62f470d183e078637e19504ac9ecf7392" }
moxcms = "0.9.2"
whereat = "0.1"
bytemuck = "1.21"
archmage = "0.9.31"

[patch.crates-io]
garb = { git = "https://github.com/imazen/garb", rev = "8f9aa10d09f84bb0a1e3fdbd1773f610eec1b784" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "52896f4b24664315586bd60e5f048253b1f69052" }
