[package]
name = "cms-contract"
version = "0.0.0"
edition = "2024"
publish = false
description = "Runs every PluggableCms backend through one behavioral contract and compares them"

# Standalone comparison runner; the production LCMS backend is separately opt-in.
[workspace]

[dependencies]
zenpixels = { path = "../zenpixels" }
zenpixels-convert = { path = "../zenpixels-convert", features = ["icc-db", "cms-moxcms", "cms-lcms"] }
lcms = { git = "https://github.com/imazen/lcms", rev = "55b59476cf64920345e9ca32eb3a4678bf0bbece" }
moxcms = "0.9.2"
whereat = "0.1"
bytemuck = "1.21"
archmage = "0.9.31"

[patch.crates-io]
archmage = { git = "https://github.com/imazen/archmage", rev = "a6be44993d8d3f8dba9a458f898d200fccba5b31" }
magetypes = { git = "https://github.com/imazen/archmage", rev = "a6be44993d8d3f8dba9a458f898d200fccba5b31" }
garb = { git = "https://github.com/imazen/garb", rev = "f22a8c5412de72255de80b5597a484c796f4e40d" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "52896f4b24664315586bd60e5f048253b1f69052" }

[dev-dependencies]
zenbench = "0.1.11"
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-decode"] }

[[bench]]
name = "icc_synthesis"
harness = false
