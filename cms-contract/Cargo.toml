[package]
name = "cms-contract"
version = "0.0.0"
edition = "2024"
publish = false
description = "Runs every PluggableCms backend through one behavioral contract and compares them"

# Standalone comparison runner; the production LCMS backend is separately opt-in.
[workspace]

[dependencies]
zenpixels = { path = "../zenpixels" }
zenpixels-convert = { path = "../zenpixels-convert", features = ["icc-db", "cms-moxcms", "cms-lcms"] }
lcms = { git = "https://github.com/imazen/lcms", rev = "55b59476cf64920345e9ca32eb3a4678bf0bbece" }
moxcms = "0.9.2"
whereat = "0.1"
bytemuck = "1.21"
archmage = "0.9.32"

[patch.crates-io]
garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585" }

[dev-dependencies]
zenbench = "0.1.11"
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-decode"] }

[[bench]]
name = "icc_synthesis"
harness = false
